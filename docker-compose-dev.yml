services:
  5005cmd-frontend:
    image: 5005cmd-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    init: true
    volumes:
      - type: bind
        source: ./frontend
        target: /app
      - type: volume
        target: /app/node_modules
    networks:
      - frontend
    ports:
      - "8236:3000"
networks:
  frontend:
  backend:
